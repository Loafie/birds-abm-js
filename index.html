<!DOCTYPE html>
<html>
    <head><title>SVG Animation Test</title>
</head>
    <body>
        <center>
            <div id="main">
            </div>
            <div class="controls" style="display: inline-flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 15px; font-family: sans-serif;">
                <label for="speedSlider" style="font-size: 14px; font-weight: bold;">
                    Speed: <span id="speedDisplay" style="font-weight: normal; min-width: 35px; display: inline-block;">1.0x</span>
                </label>
                <input type="range" id="speedSlider" min="0" max="5" step="0.1" value="1" style="width: 180px; cursor: pointer;">
                <button id="resetBtn" style="padding: 5px 14px; cursor: pointer; border-radius: 4px; border: 1px solid #bbb; background: #f4f4f4; font-size: 13px;">Reset</button>
            </div>
        </center>
        <script src="drawing.js"></script>
        <script src="abm-helpers.js"></script>
        <script src="birds.js"></script>
    </body>
</html>
